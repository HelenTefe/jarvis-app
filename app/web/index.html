<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jarvis</title>
<meta name="theme-color" content="#06080F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --nacht:#06080F; --flaeche:#11151F; --flaeche2:#181D2A; --rand:#232A3B;
  --text:#EEF1F7; --leise:#8C96AD; --gold:#F5B045; --gold-hell:#FFD58F;
  --gruen:#4CC38A; --rot:#F06A6A; --auf-gold:#1A1206;
  --oben:env(safe-area-inset-top); --unten:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--nacht);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;color:inherit}
button:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.versteckt{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Hintergrund: sanftes Leuchten */
.himmel{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(60% 45% at 50% 42%,rgba(245,176,69,.10),transparent 70%),radial-gradient(80% 60% at 50% 110%,rgba(90,70,200,.10),transparent 70%),var(--nacht)}

.buehne{position:relative;height:100dvh;display:flex;flex-direction:column;align-items:center;
  padding:calc(var(--oben) + 14px) 20px calc(var(--unten) + 18px)}

.kopfzeile{width:100%;max-width:560px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--leise)}
.marke{font-family:Sora,sans-serif;font-weight:500;letter-spacing:.32em;font-size:12px;color:var(--leise)}
.status{display:inline-flex;align-items:center;gap:7px}
.punkt{width:7px;height:7px;border-radius:50%;background:var(--leise)}
.punkt.an{background:var(--gruen);box-shadow:0 0 10px var(--gruen)} .punkt.aus{background:var(--rot)}
.symbolknopf{width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:var(--leise);cursor:pointer}
.symbolknopf:active{background:var(--flaeche)}

/* Die Kugel */
.mitte{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;width:100%;max-width:560px;min-height:0}
.mitte.antwort .kugel{width:min(40vw,150px)}
.kugel{position:relative;width:min(62vw,250px);aspect-ratio:1;border:0;padding:0;border-radius:50%;background:transparent;cursor:pointer;
  transform:scale(var(--pegel,1));transition:transform .12s ease-out,width .35s ease}
.kugel .blob{position:absolute;inset:0;border-radius:50%;filter:blur(18px);opacity:.85;mix-blend-mode:screen}
.kugel .b1{background:radial-gradient(circle at 35% 35%,#FFD58F,#F5B045 45%,transparent 70%);animation:kreisen 9s linear infinite}
.kugel .b2{background:radial-gradient(circle at 70% 40%,#FF8A5B,transparent 60%);animation:kreisen 13s linear infinite reverse}
.kugel .b3{background:radial-gradient(circle at 45% 75%,#8B6CFF,transparent 58%);animation:kreisen 11s linear infinite;opacity:.6}
.kugel .kern{position:absolute;inset:16%;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,rgba(255,255,255,.85),rgba(255,213,143,.55) 22%,rgba(245,176,69,.35) 48%,rgba(20,14,6,.0) 72%);
  box-shadow:inset 0 0 40px rgba(255,255,255,.08)}
.kugel::after{content:"";position:absolute;inset:-14%;border-radius:50%;border:1px solid rgba(245,176,69,.18);opacity:0;transition:opacity .3s}
@keyframes kreisen{from{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.06)}to{transform:rotate(360deg) scale(1)}}
@keyframes atmen{50%{transform:scale(1.04)}}
.kugel.ruhe .blob{animation-duration:16s,22s,18s}
.kugel.ruhe{animation:atmen 5s ease-in-out infinite}
.kugel.hoert::after{opacity:1;animation:welle 1.4s ease-out infinite}
.kugel.hoert .b3{opacity:.9}
.kugel.denkt .blob{animation-duration:2.4s,3s,2.7s}
.kugel.denkt .kern{animation:atmen 1.2s ease-in-out infinite}
@keyframes welle{from{transform:scale(.92);opacity:.9}to{transform:scale(1.25);opacity:0}}
@media (prefers-reduced-motion:reduce){.kugel,.kugel *,.kugel::after{animation:none !important}}

.untertitel{min-height:5.2em;max-height:30vh;overflow-y:auto;text-align:center;font-family:Sora,sans-serif;font-weight:300;font-size:clamp(19px,5.2vw,24px);line-height:1.38;
  padding:0 6px;color:var(--text);overflow-wrap:anywhere;scrollbar-width:none}
.untertitel::-webkit-scrollbar{display:none}
.untertitel.leise{color:var(--leise)}
.untertitel .du{color:var(--leise);font-size:.8em;display:block;margin-bottom:6px}
.untertitel b{font-weight:500;color:var(--gold-hell)}

/* Unten */
.fuss{width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:14px}
.vorschlaege{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.vorschlag{border:1px solid var(--rand);background:rgba(17,21,31,.6);border-radius:999px;padding:9px 14px;font-size:13.5px;cursor:pointer;color:var(--text)}
.vorschlag:active{background:var(--flaeche2)}
.leiste{width:100%;display:flex;align-items:center;justify-content:space-between}
.wartet{display:inline-flex;align-items:center;gap:8px;border:0;background:rgba(17,21,31,.75);border:1px solid var(--rand);border-radius:999px;padding:10px 16px;font-size:14px;cursor:pointer}
.wartet .zahl{min-width:22px;height:22px;border-radius:11px;background:var(--gold);color:var(--auf-gold);font-weight:600;font-size:12.5px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.wartet.ruhig .zahl{background:var(--rand);color:var(--leise)}

/* Tippen-Feld */
.tippen{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(var(--unten) + 12px);background:rgba(6,8,15,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;gap:8px;align-items:flex-end;border-top:1px solid var(--rand);z-index:20}
.tippen textarea{flex:1;min-width:0;resize:none;border:1px solid var(--rand);background:var(--flaeche);color:var(--text);border-radius:14px;padding:12px 14px;font:inherit;font-size:16px;line-height:1.35;max-height:140px}
.senden{flex:none;width:46px;height:46px;border-radius:12px;border:0;background:var(--gold);color:var(--auf-gold);display:flex;align-items:center;justify-content:center;cursor:pointer}

/* Blatt von unten */
.schleier{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
.schleier.offen{opacity:1;pointer-events:auto}
.blatt{position:fixed;left:0;right:0;bottom:0;max-height:86dvh;background:var(--flaeche);border-radius:22px 22px 0 0;border-top:1px solid var(--rand);
  transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:31;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
.blatt.offen{transform:translateY(0)}
.griff{width:40px;height:5px;border-radius:3px;background:var(--rand);margin:10px auto 4px}
.blatt-kopf{display:flex;justify-content:space-between;align-items:center;padding:6px 18px 10px}
.blatt-kopf h2{font-family:Sora,sans-serif;font-weight:500;font-size:17px;margin:0}
.blatt-inhalt{overflow-y:auto;padding:0 16px calc(var(--unten) + 20px);display:flex;flex-direction:column;gap:12px}
.abschnitt{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--leise);margin:8px 2px 0}

.beitrag{background:var(--flaeche2);border:1px solid var(--rand);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.beitrag-kopf{display:flex;justify-content:space-between;align-items:center;font-size:12px;gap:8px;color:var(--leise)}
.beitrag-kopf b{color:var(--text);font-weight:600}
.beitrag-text{font-size:14.5px;line-height:1.45;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.beitrag-text.offen{-webkit-line-clamp:unset;display:block}
.warnung{font-size:12px;color:var(--rot)}
.beitrag a{font-size:12px;color:var(--leise)}
.knoepfe{display:flex;gap:8px}
.knoepfe button{flex:1;height:46px;border-radius:12px;font-size:15px;cursor:pointer}
.ja{border:0;background:var(--gold);color:var(--auf-gold);font-weight:600}
.ja.sicher{background:var(--gruen);color:#06140d}
.nein{border:1px solid var(--rand);background:transparent}
.knoepfe button:disabled{opacity:.5}
.leer{font-size:14px;color:var(--leise);text-align:center;padding:14px;background:var(--flaeche2);border-radius:14px}

.zahlen{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kachel{background:var(--flaeche2);border:1px solid var(--rand);border-radius:14px;padding:12px 6px;text-align:center;display:flex;flex-direction:column;gap:3px;min-width:0}
.kachel .wert{font-family:Sora,sans-serif;font-size:17px;font-variant-numeric:tabular-nums}
.kachel .name{font-size:11px;color:var(--leise)}
.balken{height:4px;border-radius:2px;background:var(--rand);overflow:hidden;margin:4px 8px 0}
.balken i{display:block;height:100%;background:var(--gold);width:0}

.einstellung{display:flex;justify-content:space-between;align-items:center;background:var(--flaeche2);border:1px solid var(--rand);border-radius:14px;padding:12px 14px;font-size:14.5px}
.schalter{width:46px;height:28px;border-radius:999px;border:0;background:var(--rand);position:relative;cursor:pointer;flex:none}
.schalter::after{content:"";position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:var(--text);transition:transform .2s}
.schalter[aria-checked=true]{background:var(--gold)}
.schalter[aria-checked=true]::after{transform:translateX(18px);background:var(--auf-gold)}
.einrichten{font-size:13.5px;line-height:1.5;background:var(--flaeche2);border:1px solid var(--rand);border-radius:14px;padding:12px 14px}
.einrichten p{margin:0 0 6px}.einrichten p:last-child{margin:0}
.einrichten b{color:var(--gold)}
.verbindung{background:var(--flaeche2);border:1px solid var(--rand);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.verbindung-kopf{display:flex;justify-content:space-between;align-items:center;font-size:14.5px;gap:8px}
.verbindung-kopf small{display:block;color:var(--leise);font-size:12px;margin-top:2px}
.marke-ok{font-size:12.5px;color:var(--gruen);white-space:nowrap}.marke-fehlt{font-size:12.5px;color:var(--gold);white-space:nowrap}
.verbindung form{display:flex;gap:8px}
.verbindung input{flex:1;min-width:0;border:1px solid var(--rand);background:var(--nacht);color:var(--text);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px}
.verbindung button.speichern{flex:none;border:0;border-radius:10px;background:var(--gold);color:var(--auf-gold);font-weight:600;padding:0 14px;cursor:pointer}
.verbindung .meldung{font-size:12.5px;color:var(--leise)}
.segmente{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--nacht);border:1px solid var(--rand);border-radius:12px;padding:4px}
.segmente button{border:0;background:transparent;border-radius:9px;height:38px;font-size:14px;cursor:pointer;color:var(--leise)}
.segmente button[aria-checked=true]{background:var(--gold);color:var(--auf-gold);font-weight:600}
.textknopf{background:none;border:0;color:var(--leise);font-size:13px;cursor:pointer;padding:8px 0;align-self:center}
</style>
</head>
<body>
<div class="himmel" aria-hidden="true"></div>

<div class="buehne">
  <header class="kopfzeile">
    <span class="status" role="status"><span class="punkt" id="punkt" aria-hidden="true"></span><span id="statustext">verbinde</span></span>
    <span class="marke">JARVIS</span>
    <button type="button" class="symbolknopf" id="tastatur" aria-label="Schreiben statt sprechen">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6 10h.01M9.5 10h.01M13 10h.01M16.5 10h.01M7 14h10"/></svg>
    </button>
  </header>

  <main class="mitte">
    <button type="button" class="kugel ruhe" id="kugel" aria-label="Sprechen" aria-pressed="false">
      <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><span class="kern"></span>
    </button>
    <div class="untertitel leise" id="untertitel" aria-live="polite">Hallo Helen. Tippe auf die Kugel und sprich.</div>
  </main>

  <footer class="fuss">
    <div class="vorschlaege" id="vorschlaege" role="group" aria-label="Vorschläge">
      <button class="vorschlag" data-frage="Was wartet auf meine Freigabe?">Was wartet auf mich?</button>
      <button class="vorschlag" data-frage="Wie liefen die letzten Lulu-Aufträge?">Letzte Aufträge</button>
    </div>
    <div class="leiste">
      <button type="button" class="wartet ruhig" id="wartet" aria-haspopup="dialog">
        <span class="zahl" id="anzahl">0</span><span id="warttext">nichts wartet</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
      </button>
      <button type="button" class="symbolknopf" id="stimmeKnopf" aria-label="Stimme aus" title="Stimme an/aus">
        <svg id="lautIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path id="wellen" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      </button>
    </div>
  </footer>
</div>

<form class="tippen versteckt" id="tippen">
  <label for="feld" class="sr">Nachricht an Jarvis</label>
  <textarea id="feld" rows="1" placeholder="Schreib Jarvis …" enterkeyhint="send"></textarea>
  <button class="senden" type="submit" aria-label="Senden"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
</form>

<div class="schleier" id="schleier"></div>
<section class="blatt" id="blatt" role="dialog" aria-modal="true" aria-labelledby="blatt-titel" aria-hidden="true">
  <div class="griff" aria-hidden="true"></div>
  <div class="blatt-kopf"><h2 id="blatt-titel">Übersicht</h2><button type="button" class="symbolknopf" id="schliessen" aria-label="Schließen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="blatt-inhalt">
    <div class="abschnitt">Wartet auf dich</div>
    <div id="beitraege" style="display:flex;flex-direction:column;gap:10px"></div>
    <div class="abschnitt">Zahlen</div>
    <div class="zahlen">
      <div class="kachel"><span class="wert" id="z-besucher">–</span><span class="name">Besucher · 30 T.</span></div>
      <div class="kachel"><span class="wert" id="z-provision">–</span><span class="name">Provision · 30 T.</span></div>
      <div class="kachel"><span class="wert" id="z-kosten">–</span><span class="name">KI-Kosten · Monat</span><div class="balken" aria-hidden="true"><i id="z-budget"></i></div></div>
    </div>
    <div class="einrichten versteckt" id="einrichten"></div>
    <div class="abschnitt">Verbindungen</div>
    <div id="verbindungen" style="display:flex;flex-direction:column;gap:8px"></div>
    <div class="abschnitt">Einstellungen</div>
    <div class="einstellung" style="flex-direction:column;align-items:stretch;gap:10px"><span>Tempo</span>
      <div class="segmente" id="tempo" role="radiogroup" aria-label="Tempo">
        <button type="button" role="radio" data-tempo="blitz">Blitz</button>
        <button type="button" role="radio" data-tempo="schnell">Schnell</button>
        <button type="button" role="radio" data-tempo="gruendlich">Gründlich</button>
      </div>
      <small style="color:var(--leise);font-size:12px" id="tempoInfo"></small>
    </div>
    <div class="einstellung"><span>Jarvis antwortet mit Stimme</span><button type="button" class="schalter" id="stimmeSchalter" role="switch" aria-checked="true" aria-label="Stimme"></button></div>
    <button type="button" class="textknopf" id="vergessen">Gesprächsverlauf vergessen</button>
    <button type="button" class="textknopf" id="aktualisieren">App aktualisieren</button>
  </div>
</section>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const kugel = $("kugel"), untertitel = $("untertitel"), feld = $("feld");
  const speicher = {
    lesen(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    schreiben(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  let stimmeAn = speicher.lesen("jarvis.stimme", true);
  let tempo = speicher.lesen("jarvis.tempo", "schnell");
  const TEMPO_INFO = { blitz: "Am schnellsten. Gut für kurze Fragen und Befehle.", schnell: "Schnell und trotzdem klug – für den Alltag.", gruendlich: "Langsamer, denkt länger nach – für knifflige Fragen." };
  function setzeTempo(t) {
    tempo = t; speicher.schreiben("jarvis.tempo", t);
    document.querySelectorAll("#tempo button").forEach((b) => b.setAttribute("aria-checked", String(b.dataset.tempo === t)));
    document.getElementById("tempoInfo").textContent = TEMPO_INFO[t] || "";
  }
  document.querySelectorAll("#tempo button").forEach((b) => (b.onclick = () => setzeTempo(b.dataset.tempo)));
  setzeTempo(tempo in TEMPO_INFO ? tempo : "schnell");
  let beschaeftigt = false, serverStimme = false;

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const huebsch = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "$1").replace(/^\s*[-*•]\s+/gm, "· ").replace(/^#+\s*/gm, "").replace(/\n{2,}/g, "<br><br>").replace(/\n/g, "<br>");
  const zahl = (n, d = 0) => Number(n || 0).toLocaleString("de-DE", { minimumFractionDigits: d, maximumFractionDigits: d });
  async function api(pfad, daten, roh) {
    const opt = daten === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json", "X-Jarvis": "1" }, body: JSON.stringify(daten) };
    const a = await fetch(pfad, opt);
    if (roh && a.ok) return a;
    let j = {}; try { j = await a.json(); } catch {}
    if (!a.ok) throw new Error(j.fehler || "Fehler " + a.status);
    return j;
  }

  // ---------- Anzeige ----------
  function zustand(z) {
    for (const k of ["ruhe", "hoert", "denkt", "spricht"]) kugel.classList.toggle(k, k === z);
    kugel.setAttribute("aria-pressed", String(z === "hoert"));
    kugel.setAttribute("aria-label", z === "hoert" ? "Zuhören beenden" : z === "spricht" ? "Jarvis unterbrechen" : "Sprechen");
    if (z !== "spricht") kugel.style.setProperty("--pegel", 1);
  }
  function zeige(html, leise) {
    untertitel.innerHTML = html; untertitel.classList.toggle("leise", !!leise); untertitel.scrollTop = 0;
    document.querySelector(".mitte").classList.toggle("antwort", untertitel.textContent.length > 140);
  }

  // ---------- Stimme ----------
  let ctx = null, quelle = null, pegelUhr = null;
  function audioWecken() { // muss direkt im Antippen passieren (iPhone)
    try {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === "suspended") ctx.resume();
      const b = ctx.createBuffer(1, 1, 22050), s = ctx.createBufferSource(); s.buffer = b; s.connect(ctx.destination); s.start(0);
    } catch {}
    try { if ("speechSynthesis" in window && !speechSynthesis.speaking) speechSynthesis.speak(new SpeechSynthesisUtterance("")); } catch {}
  }
  // Sätze werden nacheinander erzeugt und abgespielt; der nächste wird schon geladen, während einer läuft.
  let warteschlange = [], spieltGerade = false, generation = 0;
  function verstummen() {
    generation++; warteschlange = []; spieltGerade = false;
    try { if (quelle) { quelle.onended = null; quelle.stop(); } } catch {}
    quelle = null; clearInterval(pegelUhr);
    try { speechSynthesis.cancel(); } catch {}
  }
  function holeTon(text, gen) {
    return api("/api/sprechen", { text }, true).then((a) => a.arrayBuffer()).then((b) => gen === generation ? ctx.decodeAudioData(b) : null).catch(() => null);
  }
  function satzSprechen(text) {
    if (!stimmeAn || !text.trim()) return;
    const gen = generation;
    if (serverStimme && ctx) warteschlange.push({ text, ton: holeTon(text, gen), gen });
    else warteschlange.push({ text, ton: Promise.resolve(null), gen });
    if (!spieltGerade) naechster();
  }
  async function naechster() {
    const e = warteschlange.shift();
    if (!e) { spieltGerade = false; if (!beschaeftigt) zustand("ruhe"); return; }
    spieltGerade = true;
    const puffer = await e.ton;
    if (e.gen !== generation) return;
    if (puffer) {
      const s = ctx.createBufferSource(), an = ctx.createAnalyser(); an.fftSize = 256;
      s.buffer = puffer; s.connect(an); an.connect(ctx.destination);
      const werte = new Uint8Array(an.frequencyBinCount);
      clearInterval(pegelUhr);
      pegelUhr = setInterval(() => { an.getByteFrequencyData(werte); let m = 0; for (const v of werte) m += v; kugel.style.setProperty("--pegel", (1 + Math.min(.14, m / werte.length / 900)).toFixed(3)); }, 60);
      s.onended = () => { clearInterval(pegelUhr); quelle = null; naechster(); };
      quelle = s; zustand("spricht"); s.start(0);
    } else if ("speechSynthesis" in window) { // Ersatz: iPhone-Stimme
      const u = new SpeechSynthesisUtterance(e.text);
      u.lang = "de-DE"; const v = speechSynthesis.getVoices().find((x) => x.lang && x.lang.startsWith("de")); if (v) u.voice = v;
      u.onend = () => { if (e.gen === generation) naechster(); };
      zustand("spricht"); speechSynthesis.speak(u);
    } else naechster();
  }
  function setzeStimme(an) {
    stimmeAn = an; speicher.schreiben("jarvis.stimme", an);
    $("stimmeSchalter").setAttribute("aria-checked", String(an));
    $("wellen").style.display = an ? "" : "none";
    $("stimmeKnopf").setAttribute("aria-label", an ? "Stimme aus" : "Stimme an");
    if (!an) { verstummen(); if (!beschaeftigt) zustand("ruhe"); }
  }
  $("stimmeKnopf").onclick = () => { audioWecken(); setzeStimme(!stimmeAn); };
  $("stimmeSchalter").onclick = () => { audioWecken(); setzeStimme(!stimmeAn); };
  setzeStimme(stimmeAn);

  // ---------- Fragen ----------
  const vorlesbar = (t) => t.replace(/https?:\/\/\S+/g, "Link").replace(/[*_`#>|]/g, "").replace(/^\s*[-•]\s*/gm, "").replace(/\s+/g, " ").trim();
  async function frage(text) {
    text = (text || "").trim();
    if (!text || beschaeftigt) return;
    beschaeftigt = true; verstummen();
    const kopf = '<span class="du">„' + esc(text) + '“</span>';
    zeige(kopf + "Einen Moment …", true);
    zustand("denkt");
    let ganz = "", rest = "", werkzeug = false, fehler = null;
    // Gibt fertige Sätze an die Stimme weiter; sehr kurze Sätze werden mit dem nächsten gebündelt.
    function sätzeAbgeben(alles) {
      const ende = /[.!?…:](?=\s)/g;
      let m, schnitt = -1;
      while ((m = ende.exec(rest))) {
        if (m.index + 1 >= 18) { schnitt = m.index + 1; break; }
      }
      if (schnitt > 0) {
        satzSprechen(vorlesbar(rest.slice(0, schnitt)));
        rest = rest.slice(schnitt).replace(/^\s+/, "");
        return sätzeAbgeben(alles);
      }
      if (alles && rest.trim()) { satzSprechen(vorlesbar(rest)); rest = ""; }
    }
    try {
      const a = await fetch("/api/chat-strom", { method: "POST", headers: { "Content-Type": "application/json", "X-Jarvis": "1" }, body: JSON.stringify({ text, tempo }) });
      if (!a.ok || !a.body) { let j = {}; try { j = await a.json(); } catch {} throw new Error(j.fehler || "Fehler " + a.status); }
      const leser = a.body.getReader(), dek = new TextDecoder();
      let puffer = "";
      for (;;) {
        const { value, done } = await leser.read();
        if (done) break;
        puffer += dek.decode(value, { stream: true });
        let i;
        while ((i = puffer.indexOf("\n\n")) >= 0) {
          const block = puffer.slice(0, i); puffer = puffer.slice(i + 2);
          if (!block.startsWith("data:")) continue;
          let ev; try { ev = JSON.parse(block.slice(5)); } catch { continue; }
          if (ev.t === "text") {
            if (!ganz) zustand("ruhe");
            ganz += ev.d; rest += ev.d;
            zeige(kopf + huebsch(ganz));
            sätzeAbgeben(false);
          } else if (ev.t === "werkzeug") {
            werkzeug = true; if (!ganz) zeige(kopf + "Ich frage Lulu …", true);
          } else if (ev.t === "fehler") fehler = ev.d;
        }
      }
      if (fehler && !ganz) throw new Error(fehler);
      if (!ganz) zeige(kopf + "(keine Antwort)", true);
      sätzeAbgeben(true);
      if (werkzeug) setTimeout(laden, 800);
    } catch (e) {
      zeige("Das hat nicht geklappt: " + esc(e.message));
    } finally {
      beschaeftigt = false;
      if (!spieltGerade) zustand("ruhe");
    }
  }
  document.querySelectorAll(".vorschlag").forEach((b) => (b.onclick = () => { audioWecken(); frage(b.dataset.frage); }));

  // ---------- Sprechen ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let erkennung = null, gehoert = "";
  kugel.onclick = () => {
    audioWecken();
    if (kugel.classList.contains("spricht")) { verstummen(); zustand("ruhe"); return; }
    if (beschaeftigt) return;
    if (!SR) { zeige("Spracheingabe geht in diesem Browser nicht. Tippe oben rechts auf die Tastatur.", true); return; }
    if (erkennung) { erkennung.stop(); return; }
    erkennung = new SR(); erkennung.lang = "de-DE"; erkennung.interimResults = true; erkennung.continuous = false;
    gehoert = "";
    erkennung.onresult = (ev) => { gehoert = Array.from(ev.results).map((r) => r[0].transcript).join(" "); zeige("„" + esc(gehoert) + "“"); };
    erkennung.onerror = (ev) => {
      zeige(ev.error === "not-allowed" || ev.error === "service-not-allowed" ? "Bitte erlaube Mikrofon und Spracherkennung für Safari (Einstellungen → Safari)." : ev.error === "no-speech" ? "Ich habe nichts gehört. Tippe nochmal." : "Spracheingabe gestört (" + esc(ev.error) + ").", true);
    };
    erkennung.onend = () => { erkennung = null; if (gehoert.trim()) frage(gehoert); else if (!beschaeftigt) zustand("ruhe"); };
    zustand("hoert"); zeige("Ich höre zu …", true);
    try { erkennung.start(); } catch { erkennung = null; zustand("ruhe"); zeige("Spracheingabe konnte nicht starten.", true); }
  };

  // ---------- Tippen ----------
  $("tastatur").onclick = () => { const t = $("tippen"); t.classList.toggle("versteckt"); if (!t.classList.contains("versteckt")) feld.focus(); };
  $("tippen").onsubmit = (e) => { e.preventDefault(); audioWecken(); const t = feld.value; feld.value = ""; feld.style.height = ""; $("tippen").classList.add("versteckt"); feld.blur(); frage(t); };
  feld.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("tippen").requestSubmit(); } });
  feld.addEventListener("input", () => { feld.style.height = "auto"; feld.style.height = Math.min(feld.scrollHeight, 140) + "px"; });

  // ---------- Blatt ----------
  function blatt(offen) {
    $("blatt").classList.toggle("offen", offen); $("schleier").classList.toggle("offen", offen);
    $("blatt").setAttribute("aria-hidden", String(!offen));
    if (offen) { laden(); $("schliessen").focus(); } else $("wartet").focus();
  }
  $("wartet").onclick = () => blatt(true);
  $("schliessen").onclick = () => blatt(false);
  $("schleier").onclick = () => blatt(false);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("blatt").classList.contains("offen")) blatt(false); });
  let startY = null;
  $("blatt").addEventListener("touchstart", (e) => { if ($("blatt").querySelector(".blatt-inhalt").scrollTop <= 0) startY = e.touches[0].clientY; }, { passive: true });
  $("blatt").addEventListener("touchend", (e) => { if (startY !== null && e.changedTouches[0].clientY - startY > 80) blatt(false); startY = null; });
  $("vergessen").onclick = async () => {
    try { await api("/api/neu", {}); blatt(false); zeige("Neues Gespräch. Wie kann ich helfen?", true); }
    catch (e) { zeige("Konnte nicht neu starten: " + esc(e.message)); }
  };

  let updateSicher = false;
  $("aktualisieren").onclick = async () => {
    const k = $("aktualisieren");
    if (!updateSicher) { updateSicher = true; k.textContent = "Wirklich aktualisieren? Nochmal tippen"; setTimeout(() => { updateSicher = false; k.textContent = "App aktualisieren"; }, 4000); return; }
    k.disabled = true; k.textContent = "Aktualisiere …";
    try {
      await api("/api/aktualisieren", {});
      k.textContent = "Lade gleich neu …";
      setTimeout(() => location.reload(), 30000);
    } catch (e) { k.disabled = false; updateSicher = false; k.textContent = "Fehlgeschlagen: " + e.message; }
  };

  // ---------- Freigaben ----------
  const PLATTFORM = { instagram: "Instagram", facebook: "Facebook", tiktok: "TikTok" };
  function zeichneBeitraege(liste, bereit) {
    const box = $("beitraege"); box.innerHTML = "";
    const n = liste.length;
    $("anzahl").textContent = n; $("wartet").classList.toggle("ruhig", !n);
    $("warttext").textContent = !bereit ? "Übersicht" : n ? (n === 1 ? "wartet auf dich" : "warten auf dich") : "nichts wartet";
    if (!bereit) { box.innerHTML = '<div class="leer">Lulu ist noch nicht verbunden.</div>'; return; }
    if (!n) { box.innerHTML = '<div class="leer">Alles erledigt – nichts wartet auf dich.</div>'; return; }
    for (const b of liste) {
      const el = document.createElement("article"); el.className = "beitrag";
      const ohneWerbung = !/(werbung|anzeige|#ad\b)/i.test(b.text || "");
      el.innerHTML =
        '<div class="beitrag-kopf"><span><b>' + esc(PLATTFORM[b.plattform] || b.plattform) + "</b> · #" + esc(b.id) + "</span><span>" +
        (b.geplant_fuer ? esc(new Date(b.geplant_fuer).toLocaleString("de-DE", { dateStyle: "short", timeStyle: "short" })) : "sofort") + "</span></div>" +
        '<div class="beitrag-text" tabindex="0">' + esc(b.text) + "</div>" +
        (ohneWerbung ? '<div class="warnung">Nicht als „Werbung“ gekennzeichnet.</div>' : "") +
        (b.link ? '<a href="' + esc(b.link) + '" target="_blank" rel="noopener">' + esc(b.link.replace(/^https?:\/\//, "").slice(0, 60)) + "</a>" : "") +
        '<div class="knoepfe"><button type="button" class="ja">Freigeben</button><button type="button" class="nein">Ablehnen</button></div>';
      const t = el.querySelector(".beitrag-text"); t.onclick = () => t.classList.toggle("offen");
      const ja = el.querySelector(".ja"), nein = el.querySelector(".nein");
      let sicher = false, uhr;
      ja.onclick = async () => {
        if (!sicher) { sicher = true; ja.classList.add("sicher"); ja.textContent = "Wirklich freigeben?"; uhr = setTimeout(() => { sicher = false; ja.classList.remove("sicher"); ja.textContent = "Freigeben"; }, 4000); return; }
        clearTimeout(uhr); await entscheide(b.id, "freigeben", ja, nein);
      };
      nein.onclick = () => entscheide(b.id, "ablehnen", ja, nein);
      box.appendChild(el);
    }
  }
  async function entscheide(id, aktion, ...k) {
    k.forEach((x) => (x.disabled = true));
    try { await api("/api/beitraege/" + id + "/" + aktion, {}); }
    catch (e) { alertText("Beitrag #" + id + ": " + e.message); }
    laden();
  }
  function alertText(t) { zeige(esc(t)); }

  // ---------- Verbindungen (Schlüssel eintragen) ----------
  const VERBINDUNGEN = [
    { name: "GITHUB_TOKEN", titel: "GitHub-Schlüssel", hilfe: "Damit Jarvis Lulus Aufträge starten kann", platz: "github_pat_…" },
    { name: "LULU_SUPABASE_URL", titel: "Datenbank-Adresse", hilfe: "https://ezcdfpxcwddbublifatj.supabase.co", platz: "https://….supabase.co" },
    { name: "LULU_SUPABASE_KEY", titel: "Datenbank-Schlüssel", hilfe: "Supabase → lulu-agent → API Keys → secret", platz: "Schlüssel einfügen" },
  ];
  let verbindungenGebaut = false;
  function zeichneVerbindungen(gesetzt) {
    const box = $("verbindungen");
    if (!verbindungenGebaut) {
      verbindungenGebaut = true;
      for (const v of VERBINDUNGEN) {
        const el = document.createElement("div"); el.className = "verbindung"; el.dataset.name = v.name;
        el.innerHTML = '<div class="verbindung-kopf"><span>' + esc(v.titel) + "<small>" + esc(v.hilfe) + '</small></span><span class="status-marke"></span></div>' +
          '<form><label class="sr" for="v-' + v.name + '">' + esc(v.titel) + '</label><input id="v-' + v.name + '" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="' + esc(v.platz) + '"><button class="speichern" type="submit">Speichern</button></form><div class="meldung" aria-live="polite"></div>';
        const form = el.querySelector("form"), feldV = el.querySelector("input"), meldung = el.querySelector(".meldung");
        form.onsubmit = async (e) => {
          e.preventDefault();
          const wert = feldV.value.trim(); if (!wert) return;
          meldung.textContent = "Speichere …";
          try { await api("/api/schluessel", { name: v.name, wert }); feldV.value = ""; meldung.textContent = "Gespeichert. Jarvis startet kurz neu."; setTimeout(laden, 6000); }
          catch (err) { meldung.textContent = err.message; }
        };
        box.appendChild(el);
      }
    }
    for (const el of box.children) {
      const ok = !!(gesetzt || {})[el.dataset.name];
      const m = el.querySelector(".status-marke");
      m.className = "status-marke " + (ok ? "marke-ok" : "marke-fehlt");
      m.textContent = ok ? "✓ eingetragen" : "fehlt";
    }
  }

  // ---------- Status ----------
  async function laden() {
    let s = { hermes: false, lulu: false, github: false, stimme: false };
    try { s = await api("/api/status"); } catch {}
    serverStimme = !!s.stimme;
    $("punkt").className = "punkt " + (s.hermes ? "an" : "aus");
    $("statustext").textContent = s.hermes ? "online" : "offline";
    zeichneVerbindungen(s.gesetzt);
    const offen = [];
    if (!s.hermes) offen.push("<b>Hermes</b> antwortet gerade nicht.");
    if (!s.github || !s.lulu) offen.push("<b>Lulu ist noch nicht ganz verbunden.</b> Trag unten bei „Verbindungen“ die fehlenden Schlüssel ein.");
    $("einrichten").classList.toggle("versteckt", !offen.length);
    $("einrichten").innerHTML = offen.map((t) => "<p>" + t + "</p>").join("");
    try { zeichneBeitraege(s.lulu ? await api("/api/beitraege") : [], s.lulu); } catch (e) { $("beitraege").innerHTML = '<div class="leer">' + esc(e.message) + "</div>"; }
    if (s.lulu) {
      try {
        const z = await api("/api/zahlen");
        $("z-besucher").textContent = zahl(z.besucher_30t);
        $("z-provision").textContent = zahl(z.provision_30t, 2) + " €";
        $("z-kosten").textContent = zahl(z.ki_kosten_monat, 2) + " $";
        $("z-budget").style.width = Math.min(100, (100 * (z.ki_kosten_monat || 0)) / (z.budget_usd || 50)) + "%";
      } catch {}
    }
  }
  const h = new Date().getHours();
  zeige((h < 11 ? "Guten Morgen, Helen." : h < 18 ? "Hallo Helen." : "Guten Abend, Helen.") + "<br>Tippe auf die Kugel und sprich.", true);
  laden();
  setInterval(() => { if (!document.hidden && !beschaeftigt) laden(); }, 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) laden(); });
})();
</script>
</body>
</html>
