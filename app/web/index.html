<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jarvis</title>
<meta name="theme-color" content="#0D1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#0D1220; --flaeche:#151C2E; --flaeche2:#1C2438; --rand:#263049;
  --text:#E8ECF5; --leise:#93A0BC; --gold:#F5B045; --gold-hell:#FFD08A; --gold-dunkel:#B07418;
  --gruen:#4CC38A; --rot:#F06A6A; --auf-gold:#1A1206;
  --radius:18px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px)}
button{font-family:inherit;color:inherit}
button:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
a{color:var(--gold)}
.leise{color:var(--leise)}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
h1,h2{font-family:Sora,Inter,sans-serif;margin:0}
h2{font-weight:500;font-size:15px}

.rahmen{max-width:1180px;margin:0 auto;display:grid;gap:20px}
@media (min-width:900px){.rahmen{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}.kopf{grid-column:1/-1}}

.kopf{display:flex;justify-content:space-between;align-items:center;gap:12px}
.kopf h1{font-weight:600;font-size:22px}
.kopf .unter{font-size:12.5px;margin-top:2px}
.pille{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--rand);border-radius:999px;font-size:12px;white-space:nowrap}
.punkt{width:8px;height:8px;border-radius:50%;background:var(--leise)}
.punkt.an{background:var(--gruen)} .punkt.aus{background:var(--rot)}

.karte{background:var(--flaeche);border:1px solid var(--rand);border-radius:var(--radius);padding:16px}
.spalte{display:flex;flex-direction:column;gap:16px;min-width:0}

/* Sprach-Kugel */
.buehne{display:flex;flex-direction:column;align-items:center;gap:14px;padding:12px 0 4px}
.kugel{width:132px;height:132px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;
  background:var(--flaeche2);color:var(--gold);box-shadow:0 0 0 10px var(--flaeche),0 0 0 22px #111829;transition:transform .15s ease,box-shadow .3s ease;-webkit-tap-highlight-color:transparent}
.kugel:active{transform:scale(.97)}
.kugel.hoert{background:radial-gradient(circle at 35% 35%,var(--gold-hell),var(--gold) 60%,var(--gold-dunkel));color:var(--auf-gold);box-shadow:0 0 0 10px #3A2E12,0 0 0 22px #241E10;animation:puls 1.6s ease-in-out infinite}
.kugel.denkt{animation:denk 1.2s linear infinite}
@keyframes puls{50%{box-shadow:0 0 0 14px #3A2E12,0 0 0 30px #1d180d}}
@keyframes denk{0%{box-shadow:0 0 0 10px var(--flaeche),0 0 0 22px #111829}50%{box-shadow:0 0 0 10px #2a2414,0 0 0 22px #181a1f}100%{box-shadow:0 0 0 10px var(--flaeche),0 0 0 22px #111829}}
@media (prefers-reduced-motion:reduce){.kugel.hoert,.kugel.denkt{animation:none}}
.hinweis{font-size:13.5px;text-align:center;min-height:20px;max-width:34ch}
.hinweis.aktiv{color:var(--gold)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rand);background:transparent;border-radius:999px;padding:9px 14px;font-size:13px;cursor:pointer}
.chip:active{background:var(--flaeche2)}

.eingabe{display:flex;gap:8px;align-items:flex-end}
.eingabe textarea{flex:1;min-width:0;resize:none;border:1px solid var(--rand);background:var(--flaeche);color:var(--text);border-radius:14px;padding:12px 14px;font:inherit;font-size:16px;line-height:1.35;max-height:140px}
.senden{flex:none;width:46px;height:46px;border-radius:12px;border:0;background:var(--gold);color:var(--auf-gold);display:flex;align-items:center;justify-content:center;cursor:pointer}
.senden:disabled{opacity:.45}

/* Gespräch */
.verlauf{display:flex;flex-direction:column;gap:10px}
.nachricht{border-radius:16px;padding:12px 14px;font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.nachricht.du{align-self:flex-end;background:var(--flaeche2);max-width:88%}
.nachricht.jarvis{background:var(--flaeche);border:1px solid var(--rand)}
.nachricht .wer{display:block;font-size:11px;letter-spacing:.04em;color:var(--leise);margin-bottom:4px}
.nachricht p{margin:0 0 .5em}.nachricht p:last-child{margin:0}
.nachricht ul{margin:.2em 0 .5em;padding-left:1.2em}
.nachricht code{font-family:"JetBrains Mono",monospace;font-size:.9em;background:#0f1526;padding:1px 5px;border-radius:5px}
.nachricht.fehler{border-color:#5a2a2a}
.leer{font-size:14px;text-align:center;padding:8px 0}
.zeile-aktionen{display:flex;justify-content:space-between;align-items:center;gap:8px}
.schalter{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--leise);background:none;border:0;cursor:pointer;padding:6px 0}
.schalter .knopf{width:34px;height:20px;border-radius:999px;background:var(--rand);position:relative;transition:background .2s}
.schalter .knopf::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--text);transition:transform .2s}
.schalter[aria-checked=true] .knopf{background:var(--gold)}
.schalter[aria-checked=true] .knopf::after{transform:translateX(14px);background:var(--auf-gold)}
.textknopf{background:none;border:0;color:var(--leise);font-size:13px;cursor:pointer;padding:6px 0}

/* Freigaben */
.abschnitt-kopf{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.zaehler{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--gold)}
.beitrag{background:var(--flaeche);border:1px solid var(--rand);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.beitrag-kopf{display:flex;justify-content:space-between;align-items:center;font-size:12px;gap:8px}
.plattform{font-weight:600;display:inline-flex;align-items:center;gap:6px}
.plattform .nr{font-family:"JetBrains Mono",monospace;color:var(--leise);font-weight:400}
.beitrag-text{font-size:14px;line-height:1.45;color:#C9D1E3;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.beitrag-text.offen{-webkit-line-clamp:unset;display:block}
.warnung{font-size:12px;color:var(--rot)}
.knoepfe{display:flex;gap:8px}
.knoepfe button{flex:1;height:44px;border-radius:10px;font-size:14px;cursor:pointer}
.ja{border:0;background:var(--gold);color:var(--auf-gold);font-weight:600}
.ja.sicher{background:var(--gruen);color:#06140d}
.nein{border:1px solid var(--rand);background:transparent}
.knoepfe button:disabled{opacity:.5}

/* Zahlen */
.zahlen{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.zahl{background:var(--flaeche);border:1px solid var(--rand);border-radius:14px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;gap:3px;min-width:0}
.zahl .wert{font-family:"JetBrains Mono",monospace;font-size:17px;font-variant-numeric:tabular-nums}
.zahl .name{font-size:11px;color:var(--leise)}
.balken{height:4px;border-radius:2px;background:var(--rand);overflow:hidden;margin-top:4px}
.balken i{display:block;height:100%;background:var(--gold);width:0}

.einrichten{font-size:13.5px;line-height:1.5}
.einrichten b{color:var(--gold);font-weight:600}
.versteckt{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="rahmen">
  <header class="kopf">
    <div>
      <h1>Jarvis</h1>
      <div class="unter leise" id="begruessung">Hallo Helen</div>
    </div>
    <span class="pille" id="status" role="status"><span class="punkt" id="statuspunkt" aria-hidden="true"></span><span id="statustext">verbinde …</span></span>
  </header>

  <main class="spalte" aria-label="Mit Jarvis sprechen">
    <section class="buehne">
      <button type="button" class="kugel" id="kugel" aria-label="Sprechen" aria-pressed="false">
        <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/></svg>
      </button>
      <p class="hinweis leise" id="hinweis" aria-live="polite">Tippen und sprechen</p>
    </section>

    <div class="chips" role="group" aria-label="Schnellbefehle">
      <button class="chip" data-frage="Was wartet auf meine Freigabe?">Was wartet auf mich?</button>
      <button class="chip" data-frage="Starte den Lulu-Wochenbericht.">Wochenbericht</button>
      <button class="chip" data-frage="Lass Lulu neue Themen-Ideen suchen.">Neue Themen</button>
      <button class="chip" data-frage="Wie liefen die letzten Lulu-Aufträge?">Letzte Läufe</button>
      <button class="chip" data-frage="Was hat Lulu diesen Monat gekostet?">Kosten</button>
    </div>

    <form class="eingabe" id="formular">
      <label for="feld" class="sr">Nachricht an Jarvis</label>
      <textarea id="feld" rows="1" placeholder="Oder hier schreiben …" enterkeyhint="send"></textarea>
      <button class="senden" id="senden" type="submit" aria-label="Senden">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>

    <div class="zeile-aktionen">
      <button type="button" class="schalter" id="vorlesen" role="switch" aria-checked="true"><span class="knopf" aria-hidden="true"></span>Antworten vorlesen</button>
      <button type="button" class="textknopf" id="leeren">Verlauf leeren</button>
    </div>

    <section class="verlauf" id="verlauf" aria-label="Gespräch" aria-live="polite"></section>
  </main>

  <aside class="spalte" aria-label="Übersicht">
    <section class="spalte" style="gap:10px" aria-labelledby="t-wartet">
      <div class="abschnitt-kopf"><h2 id="t-wartet">Wartet auf dich</h2><span class="zaehler" id="anzahl"></span></div>
      <div id="beitraege" class="spalte" style="gap:10px"></div>
    </section>

    <section aria-labelledby="t-zahlen" class="spalte" style="gap:10px">
      <h2 id="t-zahlen">Zahlen</h2>
      <div class="zahlen">
        <div class="zahl"><span class="wert" id="z-besucher">–</span><span class="name">Besucher · 30 T.</span></div>
        <div class="zahl"><span class="wert" id="z-provision">–</span><span class="name">Provision · 30 T.</span></div>
        <div class="zahl"><span class="wert" id="z-kosten">–</span><span class="name">KI-Kosten · Monat</span><div class="balken" aria-hidden="true"><i id="z-budget"></i></div></div>
      </div>
    </section>

    <section class="karte einrichten versteckt" id="einrichten" aria-label="Einrichtung"></section>
  </aside>
</div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const kugel = $("kugel"), hinweis = $("hinweis"), verlauf = $("verlauf"), feld = $("feld");
  const speicher = {
    lesen(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    schreiben(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  let nachrichten = speicher.lesen("jarvis.verlauf", []);
  let vorlesen = speicher.lesen("jarvis.vorlesen", true);
  let beschaeftigt = false;

  // ---------- Hilfen ----------
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  function markdown(text) {
    const zeilen = esc(text).split(/\n/);
    let html = "", liste = false, absatz = [];
    const inline = (s) => s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
    const absatzEnde = () => { if (absatz.length) { html += "<p>" + inline(absatz.join("<br>")) + "</p>"; absatz = []; } };
    for (const z of zeilen) {
      const m = z.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)$/);
      if (m) { absatzEnde(); if (!liste) { html += "<ul>"; liste = true; } html += "<li>" + inline(m[1]) + "</li>"; continue; }
      if (liste) { html += "</ul>"; liste = false; }
      if (!z.trim()) absatzEnde(); else absatz.push(z.replace(/^#+\s*/, ""));
    }
    absatzEnde(); if (liste) html += "</ul>";
    return html;
  }
  async function api(pfad, daten) {
    const opt = daten === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json", "X-Jarvis": "1" }, body: JSON.stringify(daten) };
    const a = await fetch(pfad, opt);
    let j = {}; try { j = await a.json(); } catch {}
    if (!a.ok) throw new Error(j.fehler || "Fehler " + a.status);
    return j;
  }
  const zahl = (n, d = 0) => Number(n || 0).toLocaleString("de-DE", { minimumFractionDigits: d, maximumFractionDigits: d });

  // ---------- Begrüßung ----------
  const h = new Date().getHours();
  $("begruessung").textContent = h < 11 ? "Guten Morgen, Helen" : h < 18 ? "Hallo Helen" : "Guten Abend, Helen";

  // ---------- Verlauf ----------
  function zeichneVerlauf() {
    verlauf.innerHTML = "";
    if (!nachrichten.length) {
      verlauf.innerHTML = '<p class="leer leise">Frag mich etwas – zum Beispiel „Was wartet auf mich?“</p>';
      return;
    }
    for (const n of nachrichten.slice(-12)) {
      const el = document.createElement("div");
      el.className = "nachricht " + (n.wer === "du" ? "du" : "jarvis") + (n.fehler ? " fehler" : "");
      el.innerHTML = (n.wer === "du" ? "" : '<span class="wer">JARVIS · ' + esc(n.zeit || "") + "</span>") + markdown(n.text);
      verlauf.appendChild(el);
    }
  }
  function merke(n) { nachrichten.push(n); nachrichten = nachrichten.slice(-40); speicher.schreiben("jarvis.verlauf", nachrichten); zeichneVerlauf(); }
  $("leeren").onclick = () => { nachrichten = []; speicher.schreiben("jarvis.verlauf", []); zeichneVerlauf(); };

  // ---------- Vorlesen ----------
  function setzeVorlesen(an) { vorlesen = an; $("vorlesen").setAttribute("aria-checked", String(an)); speicher.schreiben("jarvis.vorlesen", an); if (!an) try { speechSynthesis.cancel(); } catch {} }
  $("vorlesen").onclick = () => setzeVorlesen(!vorlesen);
  setzeVorlesen(vorlesen);
  function sprich(text) {
    if (!vorlesen || !("speechSynthesis" in window)) return;
    const rein = text.replace(/[*`#_>]/g, "").replace(/https?:\/\/\S+/g, "Link").slice(0, 1200);
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(rein); u.lang = "de-DE"; u.rate = 1.03;
      const stimme = speechSynthesis.getVoices().find((v) => v.lang && v.lang.startsWith("de"));
      if (stimme) u.voice = stimme;
      speechSynthesis.speak(u);
    } catch {}
  }

  // ---------- Fragen ----------
  function zustand(z, text) {
    kugel.classList.toggle("hoert", z === "hoert");
    kugel.classList.toggle("denkt", z === "denkt");
    kugel.setAttribute("aria-pressed", String(z === "hoert"));
    kugel.setAttribute("aria-label", z === "hoert" ? "Zuhören beenden" : "Sprechen");
    hinweis.textContent = text;
    hinweis.classList.toggle("aktiv", z !== "ruhe");
  }
  async function frage(text) {
    text = (text || "").trim();
    if (!text || beschaeftigt) return;
    beschaeftigt = true; $("senden").disabled = true;
    merke({ wer: "du", text });
    zustand("denkt", "Jarvis denkt …");
    try {
      const a = await api("/api/chat", { text });
      const zeit = new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
      merke({ wer: "jarvis", text: a.antwort, zeit });
      sprich(a.antwort);
      if ((a.werkzeuge || []).length) setTimeout(laden, 800);
    } catch (e) {
      merke({ wer: "jarvis", text: "Das hat nicht geklappt: " + e.message, fehler: true });
    } finally {
      beschaeftigt = false; $("senden").disabled = false;
      zustand("ruhe", "Tippen und sprechen");
    }
  }
  $("formular").onsubmit = (e) => { e.preventDefault(); const t = feld.value; feld.value = ""; feld.style.height = ""; frage(t); };
  feld.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("formular").requestSubmit(); } });
  feld.addEventListener("input", () => { feld.style.height = "auto"; feld.style.height = Math.min(feld.scrollHeight, 140) + "px"; });
  document.querySelectorAll(".chip").forEach((c) => (c.onclick = () => frage(c.dataset.frage)));

  // ---------- Spracheingabe ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let erkennung = null, gehoert = "";
  function zuhoeren() {
    if (beschaeftigt) return;
    try { speechSynthesis.cancel(); } catch {}
    if (!SR) { zustand("ruhe", "Spracheingabe geht in diesem Browser nicht – bitte unten schreiben oder das Mikrofon der Tastatur nutzen."); feld.focus(); return; }
    if (erkennung) { erkennung.stop(); return; }
    erkennung = new SR(); erkennung.lang = "de-DE"; erkennung.interimResults = true; erkennung.continuous = false;
    gehoert = "";
    erkennung.onresult = (ev) => {
      gehoert = Array.from(ev.results).map((r) => r[0].transcript).join(" ");
      hinweis.textContent = "„" + gehoert + "“";
    };
    erkennung.onerror = (ev) => {
      const text = ev.error === "not-allowed" || ev.error === "service-not-allowed" ? "Mikrofon ist nicht erlaubt – bitte in den Einstellungen freigeben." : ev.error === "no-speech" ? "Ich habe nichts gehört." : "Spracheingabe gestört (" + ev.error + ").";
      zustand("ruhe", text);
    };
    erkennung.onend = () => { erkennung = null; if (gehoert.trim()) frage(gehoert); else if (!beschaeftigt && kugel.classList.contains("hoert")) zustand("ruhe", "Tippen und sprechen"); };
    zustand("hoert", "Ich höre zu …");
    try { erkennung.start(); } catch { erkennung = null; zustand("ruhe", "Spracheingabe konnte nicht starten."); }
  }
  kugel.onclick = zuhoeren;

  // ---------- Freigaben ----------
  const PLATTFORM = { instagram: "Instagram", facebook: "Facebook", tiktok: "TikTok" };
  function zeichneBeitraege(liste, luluBereit) {
    const box = $("beitraege");
    box.innerHTML = "";
    $("anzahl").textContent = liste.length ? liste.length + " offen" : "";
    $("begruessung").textContent = $("begruessung").textContent.split(" · ")[0] + (liste.length ? " · " + liste.length + (liste.length === 1 ? " Ding wartet" : " Dinge warten") + " auf dich" : "");
    if (!luluBereit) { box.innerHTML = '<p class="leer leise karte">Lulu ist noch nicht verbunden.</p>'; return; }
    if (!liste.length) { box.innerHTML = '<p class="leer leise karte">Alles erledigt – nichts wartet auf dich.</p>'; return; }
    for (const b of liste) {
      const el = document.createElement("article");
      el.className = "beitrag";
      const ohneWerbung = !/(werbung|anzeige|#ad\b)/i.test(b.text || "");
      el.innerHTML =
        '<div class="beitrag-kopf"><span class="plattform">' + esc(PLATTFORM[b.plattform] || b.plattform) + ' <span class="nr">#' + esc(b.id) + "</span></span>" +
        '<span class="leise">' + (b.geplant_fuer ? "geplant " + esc(new Date(b.geplant_fuer).toLocaleString("de-DE", { dateStyle: "short", timeStyle: "short" })) : "sofort nach Freigabe") + "</span></div>" +
        '<div class="beitrag-text" tabindex="0" title="Antippen für ganzen Text">' + esc(b.text) + "</div>" +
        (ohneWerbung ? '<div class="warnung">Achtung: nicht als „Werbung“ gekennzeichnet.</div>' : "") +
        (b.link ? '<a class="leise" style="font-size:12px" href="' + esc(b.link) + '" target="_blank" rel="noopener">' + esc(b.link.replace(/^https?:\/\//, "").slice(0, 60)) + "</a>" : "") +
        '<div class="knoepfe"><button type="button" class="ja">Freigeben</button><button type="button" class="nein">Ablehnen</button></div>';
      const textEl = el.querySelector(".beitrag-text");
      textEl.onclick = () => textEl.classList.toggle("offen");
      const ja = el.querySelector(".ja"), nein = el.querySelector(".nein");
      let sicher = false, uhr;
      ja.onclick = async () => {
        if (!sicher) { sicher = true; ja.classList.add("sicher"); ja.textContent = "Wirklich freigeben?"; uhr = setTimeout(() => { sicher = false; ja.classList.remove("sicher"); ja.textContent = "Freigeben"; }, 4000); return; }
        clearTimeout(uhr); await entscheide(b.id, "freigeben", ja, nein);
      };
      nein.onclick = () => entscheide(b.id, "ablehnen", ja, nein);
      box.appendChild(el);
    }
  }
  async function entscheide(id, aktion, ...knoepfe) {
    knoepfe.forEach((k) => (k.disabled = true));
    try {
      await api("/api/beitraege/" + id + "/" + aktion, {});
      merke({ wer: "jarvis", text: "Beitrag #" + id + (aktion === "freigeben" ? " ist freigegeben." : " ist abgelehnt."), zeit: new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) });
    } catch (e) {
      merke({ wer: "jarvis", text: "Konnte Beitrag #" + id + " nicht ändern: " + e.message, fehler: true });
    }
    laden();
  }

  // ---------- Status & Zahlen ----------
  function zeigeEinrichtung(s) {
    const box = $("einrichten");
    const offen = [];
    if (!s.hermes) offen.push("<b>Hermes</b> antwortet gerade nicht. Kurz warten oder den Server neu starten.");
    if (!s.github) offen.push("<b>GitHub-Schlüssel</b> fehlt: in der Hermes-App unter Einstellungen → Keys bei GITHUB_TOKEN eintragen.");
    if (!s.lulu) offen.push("<b>Lulu-Datenbank</b> fehlt: LULU_SUPABASE_URL und LULU_SUPABASE_KEY in Hermes eintragen.");
    box.classList.toggle("versteckt", !offen.length);
    box.innerHTML = offen.length ? "<h2 style='margin-bottom:8px'>Noch einzurichten</h2>" + offen.map((t) => "<p style='margin:0 0 6px'>" + t + "</p>").join("") : "";
  }
  async function laden() {
    let s = { hermes: false, lulu: false, github: false };
    try { s = await api("/api/status"); } catch {}
    $("statuspunkt").className = "punkt " + (s.hermes ? "an" : "aus");
    $("statustext").textContent = s.hermes ? "online" : "offline";
    zeigeEinrichtung(s);
    try { zeichneBeitraege(s.lulu ? await api("/api/beitraege") : [], s.lulu); } catch (e) { $("beitraege").innerHTML = '<p class="leer leise karte">' + esc(e.message) + "</p>"; }
    if (s.lulu) {
      try {
        const z = await api("/api/zahlen");
        $("z-besucher").textContent = zahl(z.besucher_30t);
        $("z-provision").textContent = zahl(z.provision_30t, 2) + " €";
        $("z-kosten").textContent = zahl(z.ki_kosten_monat, 2) + " $";
        $("z-budget").style.width = Math.min(100, (100 * (z.ki_kosten_monat || 0)) / (z.budget_usd || 50)) + "%";
      } catch {}
    }
  }

  zeichneVerlauf();
  laden();
  setInterval(() => { if (!document.hidden && !beschaeftigt) laden(); }, 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) laden(); });
})();
</script>
</body>
</html>
